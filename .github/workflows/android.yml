name: Build JingJian APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify persistent signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing SIGNING_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/jingjian-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jingjian-signing/release.jks"
          test -s "$RUNNER_TEMP/jingjian-signing/release.jks"
          echo "JINGJIAN_SIGNING_STORE=$RUNNER_TEMP/jingjian-signing/release.jks" >> "$GITHUB_ENV"
          echo "JINGJIAN_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JINGJIAN_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "JINGJIAN_SIGNING_KEY_ALIAS=jingjian" >> "$GITHUB_ENV"

      - name: Record expected signing certificate
        run: |
          EXPECTED_CERT=$(keytool -list -v -keystore "$JINGJIAN_SIGNING_STORE" -storepass "$JINGJIAN_SIGNING_STORE_PASSWORD" -alias jingjian | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED_CERT"
          echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT" >> "$GITHUB_ENV"
          echo "Expected signing certificate SHA-256: $EXPECTED_CERT"

      - name: Extract Android source archive
        run: unzip -q 'jingjian-android-1.4.0-source.zip' -d source

      - name: Validate source version and Kotlin structure
        working-directory: source/jingjian
        run: |
          grep -F 'private const val APP_VERSION = "1.4.0"' app/src/main/java/com/akiyo/cleanguard/MainActivity.kt
          grep -F 'versionCode = 7' app/build.gradle.kts
          grep -F 'versionName = "1.4.0"' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/akiyo/cleanguard/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          if s.count("private fun inspectCarrierComponents") != 1:
              raise SystemExit("Carrier scan function check failed")
          if "com.miui.guardprovider" in s:
              raise SystemExit("OEM security component must not be included in carrier uninstall targets")
          if "PREF_LAST_REPORT" in s:
              raise SystemExit("Old detection history preference must not be present")
          print("Source checks passed.")
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: source/jingjian
        run: gradle wrapper --gradle-version 8.9

      - name: Build signed APK
        working-directory: source/jingjian
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK metadata, signature and checksum
        working-directory: source/jingjian
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.akiyo.cleanguard' versionCode='7' versionName='1.4.0'"
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA256"
          echo "Actual certificate SHA-256:   $ACTUAL_CERT"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          echo "$ACTUAL_CERT" > app/build/outputs/apk/debug/SIGNING-CERT-SHA256.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jingjian-1.4.0
          path: |
            source/jingjian/app/build/outputs/apk/debug/app-debug.apk
            source/jingjian/app/build/outputs/apk/debug/SHA256SUMS.txt
            source/jingjian/app/build/outputs/apk/debug/SIGNING-CERT-SHA256.txt
          if-no-files-found: error
          retention-days: 30
